{% extends 'planner/base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Días</h3>
  <a href="{% url 'planner:day_view' date_str=fecha %}">
      Ver día
  </a>
</div>

<ul class="list-group">
  {% for d in days %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <a href="{% url 'planner:day_view' date_str=d.date|date:'Y-m-d' %}">
            {{ d.date|date:"l d \\d\\e F \\d\\e Y" }}
        </a>
      </div>

      <div>
        <small class="text-muted">
            {{ d.hours.count }} franjas
        </small>
      </div>
    </li>

  {% empty %}
    <li class="list-group-item">
        No hay días aún. Haz clic en "Abrir hoy".
    </li>
  {% endfor %}
</ul>
{% endblock %}
