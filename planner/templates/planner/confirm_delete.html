{% extends 'planner/base.html' %}
{% block content %}
<div class="card">
  <div class="card-body">
    <p>¿Seguro que quieres borrar la tarea "<strong>{{ task.title }}</strong>"?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Sí, borrar</button>
      <a class="btn btn-secondary" href="{% url 'planner:day_view' task.hourslot.day.date %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
