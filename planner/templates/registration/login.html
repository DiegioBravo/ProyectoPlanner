<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family: Arial, sans-serif;

            background:#f4f6f9;

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .login-container{

            width:100%;
            max-width:400px;

            background:white;

            padding:40px;

            border-radius:12px;

            box-shadow:0 4px 20px rgba(0,0,0,0.1);
        }

        .login-container h1{

            text-align:center;

            margin-bottom:30px;

            color:#333;
        }

        .form-group{

            margin-bottom:20px;
        }

        .form-group label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#444;
        }

        .form-group input{

            width:100%;

            padding:12px;

            border:1px solid #ccc;

            border-radius:8px;

            font-size:15px;
        }

        .btn-login{

            width:100%;

            padding:12px;

            border:none;

            border-radius:8px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .btn-login:hover{

            background:#1d4ed8;
        }

        .error-message{

            background:#fee2e2;

            color:#b91c1c;

            padding:10px;

            border-radius:8px;

            margin-bottom:20px;

            text-align:center;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>Iniciar Sesión</h1>

        {% if form.errors %}

            <div class="error-message">

                Usuario o contraseña incorrectos

            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Usuario</label>

                <input type="text"
                       name="username"
                       required>

            </div>

            <div class="form-group">

                <label>Contraseña</label>

                <input type="password"
                       name="password"
                       required>

            </div>

            <button type="submit"
                    class="btn-login">

                Entrar

            </button>

        </form>

    </div>

</body>

</html>
